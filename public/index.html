<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Agoge - Application de suivi sportif pour haltérophiles : séances, nutrition, poids et physique">
  <meta name="theme-color" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agoge">
  <meta name="format-detection" content="telephone=no">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://world.openfoodfacts.org" crossorigin>
  <link rel="dns-prefetch" href="https://world.openfoodfacts.org">
  <link rel="preconnect" href="https://static.openfoodfacts.org" crossorigin>
  <link rel="dns-prefetch" href="https://static.openfoodfacts.org">
  <title>Agoge - Suivi Sportif</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Big+Shoulders+Stencil+Text:wght@700&family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Applique le thème sauvegardé avant le premier rendu (évite le flash)
    try {
      var _t = localStorage.getItem('agoge_theme') || 'noir';
      document.documentElement.setAttribute('data-theme', _t);
    } catch (e) {}
  </script>
</head>
<body>
  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="logo.png" alt="Agoge" class="logo-mark">
        <h1>AGOGE</h1>
        <p class="tagline">Ton suivi sportif, ta progression.</p>
      </div>
      <div id="auth-forms">
        <!-- Login form -->
        <form id="login-form" class="auth-form">
          <h2>Connexion</h2>
          <label>Email
            <input type="email" id="login-email" required placeholder="ton@email.fr" autocomplete="email">
          </label>
          <label>Mot de passe
            <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password">
          </label>
          <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
          <p class="auth-switch">Pas de compte ? <a href="#" data-auth-switch="register">Créer un compte</a></p>
        </form>
        <!-- Register form -->
        <form id="register-form" class="auth-form hidden">
          <h2>Inscription</h2>
          <label>Nom / Pseudo
            <input type="text" id="register-name" required placeholder="Ton nom" autocomplete="name">
          </label>
          <label>Email
            <input type="email" id="register-email" required placeholder="ton@email.fr" autocomplete="email">
          </label>
          <label>Mot de passe (min. 6 caractères)
            <input type="password" id="register-password" required minlength="6" placeholder="••••••••" autocomplete="new-password">
          </label>
          <label>Âge <span class="optional">(optionnel)</span>
            <input type="number" id="register-age" min="10" max="120" placeholder="25">
          </label>
          <label>Taille (cm) <span class="optional">(optionnel)</span>
            <input type="number" id="register-height" min="100" max="250" placeholder="180">
          </label>
          <label>Objectif
            <select id="register-goal">
              <option value="prise_masse">Prise de masse</option>
              <option value="seche">Sèche / Perte de gras</option>
              <option value="maintien">Maintien / Recomposition</option>
              <option value="force">Force</option>
            </select>
          </label>
          <button type="submit" class="btn btn-primary btn-block">Créer mon compte</button>
          <p class="auth-switch">Déjà un compte ? <a href="#" data-auth-switch="login">Se connecter</a></p>
        </form>
      </div>
      <div id="auth-error" class="auth-error hidden"></div>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="app hidden">
    <header class="app-header">
      <div class="header-title">
        <img src="logo.png" alt="Agoge" class="logo-mini">
        <span>AGOGE</span>
      </div>
      <div class="header-actions">
        <span id="offline-badge" class="offline-badge hidden">📡 Hors-ligne</span>
        <button id="sync-btn" class="icon-btn" title="Synchroniser">🔄</button>
      </div>
    </header>

    <main id="view-container" class="view-container"></main>

    <nav class="bottom-nav">
      <a href="#" data-route="home" class="nav-item active">
        <span class="nav-icon">🏠</span><span>Accueil</span>
      </a>
      <a href="#" data-route="sessions" class="nav-item">
        <span class="nav-icon">💪</span><span>Séances</span>
      </a>
      <a href="#" data-route="nutrition" class="nav-item">
        <span class="nav-icon">🥗</span><span>Alimentation</span>
      </a>
      <a href="#" data-route="body" class="nav-item">
        <span class="nav-icon">📊</span><span>Physique</span>
      </a>
      <a href="#" data-route="profile" class="nav-item">
        <span class="nav-icon">👤</span><span>Profil</span>
      </a>
    </nav>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Modal container -->
  <div id="modal-root"></div>

  <script src="js/db.js"></script>
  <script src="js/api.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/sessions.js"></script>
  <script src="js/pages/nutrition.js"></script>
  <script src="js/pages/body.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
